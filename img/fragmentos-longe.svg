  <!-- Reflexos de luz por cima do vidro -->
  <g>
    <polygon points="480.4,488.6 501.4,475.5 492.1,504.5" fill="url(#luz-3)" opacity="0.48"/>
    <polygon points="416.7,172.8 423.7,147.3 436.2,170.9" fill="url(#luz-4)" opacity="0.34"/>
    <polygon points="325.1,505.5 323.7,516.1 317.2,509.8" fill="url(#luz-1)" opacity="0.22"/>
