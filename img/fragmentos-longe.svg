<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <!-- Ladrilho de fragmentos pequenos, que parecem mais distantes.
       Feito pra repetir (background-repeat), por isso nenhum triângulo encosta na borda.
       Gerado por script: maior = mais perto = mais opaco. -->
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4eef7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fc6dc" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="prisma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a6e"/>
      <stop offset="0.35" stop-color="#ffd84d"/>
      <stop offset="0.65" stop-color="#6dffb0"/>
      <stop offset="1" stop-color="#4fd8eb"/>
    </linearGradient>
    <!-- Reflexos de luz: arco-íris fraco no lado onde a luz bate (de cima),
         sumindo antes do outro lado. 4 direções para não ficar tudo igual -->
    <linearGradient id="luz-1" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.7"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-2" x1="0.9" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.7"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-3" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.7"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-4" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5fd8f0" stop-opacity="0.7"/>
      <stop offset="0.2" stop-color="#7dffb8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#ffd84d" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ff8a9a" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <!-- Desfoque leve: coisas distantes ficam menos nítidas -->
    <filter id="distancia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <g filter="url(#distancia)">
  <!-- Fragmentos de vidro -->
  <g fill="url(#vidro)" stroke="#d4f7ff" stroke-opacity="0.2" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="480.4,488.6 501.4,475.5 492.1,504.5" opacity="0.6"/>
    <polygon points="416.7,172.8 423.7,147.3 436.2,170.9" opacity="0.5"/>
    <polygon points="325.1,505.5 323.7,516.1 317.2,509.8" opacity="0.3"/>
    <polygon points="647,495.4 643.9,519.1 619.7,508.4" opacity="0.7"/>
    <polygon points="696.2,309 699.7,325.8 688.9,321.7" opacity="0.4"/>
    <polygon points="834.8,775 818.3,777.4 828.3,761.4" opacity="0.4"/>
    <polygon points="364.5,820.5 371.8,797.1 387.5,810.3" opacity="0.6"/>
    <polygon points="614.2,186.7 607.1,177.4 624.5,177.8" opacity="0.3"/>
    <polygon points="221.5,574.2 233.2,549.9 247.8,562.7" opacity="0.7"/>
    <polygon points="548.3,562.5 566.1,557.9 554.8,577.9" opacity="0.5"/>
  </g>

  <!-- Reflexos de luz por cima do vidro -->
  <g>
    <polygon points="480.4,488.6 501.4,475.5 492.1,504.5" fill="url(#luz-3)" opacity="0.57"/>
    <polygon points="416.7,172.8 423.7,147.3 436.2,170.9" fill="url(#luz-4)" opacity="0.41"/>
    <polygon points="325.1,505.5 323.7,516.1 317.2,509.8" fill="url(#luz-1)" opacity="0.27"/>
    <polygon points="647,495.4 643.9,519.1 619.7,508.4" fill="url(#luz-2)" opacity="0.59"/>
    <polygon points="696.2,309 699.7,325.8 688.9,321.7" fill="url(#luz-4)" opacity="0.3"/>
    <polygon points="834.8,775 818.3,777.4 828.3,761.4" fill="url(#luz-2)" opacity="0.39"/>
    <polygon points="364.5,820.5 371.8,797.1 387.5,810.3" fill="url(#luz-3)" opacity="0.5"/>
    <polygon points="614.2,186.7 607.1,177.4 624.5,177.8" fill="url(#luz-2)" opacity="0.28"/>
    <polygon points="221.5,574.2 233.2,549.9 247.8,562.7" fill="url(#luz-3)" opacity="0.49"/>
    <polygon points="548.3,562.5 566.1,557.9 554.8,577.9" fill="url(#luz-2)" opacity="0.46"/>
  </g>

  <!-- Estilhaços com brilho prismático -->
  <g fill="url(#prisma)">
    <polygon points="638.9,80 634,91.7 630.4,82.9" opacity="0.4"/>
    <polygon points="202.5,265.9 195.8,265.3 198.8,261.7" opacity="0.4"/>
    <polygon points="411.1,268.1 407.9,279 399.9,269.2" opacity="0.3"/>
    <polygon points="288.1,643.9 286.6,647.7 283.9,642" opacity="0.5"/>
    <polygon points="484.1,407.5 479.2,403.5 487.7,403" opacity="0.5"/>
    <polygon points="632.2,593.6 640.9,591.2 639.3,603" opacity="0.5"/>
  </g>
  </g>
</svg>
