    <polygon points="321.8,448.7 299.2,446.3 325.3,432.1" fill="url(#luz-4)" opacity="0.37"/>
    <polygon points="797.2,206.5 811.7,213.2 797.1,220.1" fill="url(#luz-1)" opacity="0.34"/>
    <polygon points="232.5,226 260.3,220 255.8,240.4" fill="url(#luz-1)" opacity="0.4"/>
    <polygon points="665.2,759 659.8,779.5 647.4,770.8" fill="url(#luz-2)" opacity="0.32"/>
    <polygon points="376.3,339 389.9,335.5 384.8,351.5" fill="url(#luz-2)" opacity="0.24"/>
  </g>

  <!-- Estilhaços com brilho prismático -->
  <g fill="url(#prisma)">
    <polygon points="638.9,80 634,91.7 630.4,82.9" opacity="0.4"/>
    <polygon points="202.5,265.9 195.8,265.3 198.8,261.7" opacity="0.4"/>
    <polygon points="411.1,268.1 407.9,279 399.9,269.2" opacity="0.3"/>
