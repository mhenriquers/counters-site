<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <!-- Ladrilho de fragmentos pequenos, que parecem mais distantes.
       Feito pra repetir (background-repeat), por isso nenhum triângulo encosta na borda.
       Gerado por script: maior = mais perto = mais opaco. -->
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4eef7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fc6dc" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="prisma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a6e"/>
      <stop offset="0.35" stop-color="#ffd84d"/>
      <stop offset="0.65" stop-color="#6dffb0"/>
      <stop offset="1" stop-color="#4fd8eb"/>
    </linearGradient>
    <!-- Reflexos de luz: arco-íris fraco no lado onde a luz bate (de cima),
         sumindo antes do outro lado. 4 direções para não ficar tudo igual -->
    <linearGradient id="luz-1" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.55"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-2" x1="0.9" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.55"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-3" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ff8a9a" stop-opacity="0.55"/>
      <stop offset="0.2" stop-color="#ffd84d" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#7dffb8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#5fd8f0" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="luz-4" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5fd8f0" stop-opacity="0.55"/>
      <stop offset="0.2" stop-color="#7dffb8" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#ffd84d" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ff8a9a" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <!-- Desfoque leve: coisas distantes ficam menos nítidas -->
    <filter id="distancia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <g filter="url(#distancia)">
  <!-- Fragmentos de vidro -->
  <g fill="url(#vidro)" stroke="#d4f7ff" stroke-opacity="0.2" stroke-width="0.6" stroke-linejoin="round">
